name: Composables stability

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  compose_stability:
    name: Composables stability
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GIT
        uses: actions/checkout@v7

      - name: Setup Java SDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Build Compose compiler report (Jetpack Compose)
        run: ./gradlew assembleDemo -PcomposeCompilerReports=true

      - name: Analyze the report (Ratio)
        run: ./gradlew :ci-actions:compose-stability:run

      - name: Upload the Compose Stability report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compose-stability-report
          path: ci-actions/compose-stability/ratio-compose-stability-report.txt