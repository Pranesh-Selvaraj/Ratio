name: Issue Comment Action

on:
  issue_comment:
    types: [ created ]

permissions:
  contents: read
  issues: write

jobs:
  handle-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Execute the "Issue Assign" automation
        run: ./gradlew :ci-actions:issue-assign:run --args='issueNumber=${{ github.event.issue.number }} gitHubPAT=${{ secrets.GITHUB_TOKEN }}'
